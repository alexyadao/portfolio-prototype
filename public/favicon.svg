<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ay-favicon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="favicon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Dark slate rounded square badge background -->
  <rect width="64" height="64" rx="16" fill="url(#favicon-bg)" />
  <rect width="64" height="64" rx="16" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="2" />

  <!-- Terminal bracket accents `<` and `>` -->
  <path d="M 11 22 L 6 32 L 11 42" stroke="url(#ay-favicon-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />
  <path d="M 53 22 L 58 32 L 53 42" stroke="url(#ay-favicon-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />

  <!-- Letter 'A' chevron & outer legs -->
  <path d="M 17 49 L 32 13 L 47 49" stroke="url(#ay-favicon-grad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- A crossbar with circuit traces -->
  <path d="M 22.5 35 L 27.5 35 M 36.5 35 L 41.5 35" stroke="url(#ay-favicon-grad)" stroke-width="3.8" stroke-linecap="round" />

  <!-- Letter 'Y' upper fork & central data bus -->
  <path d="M 23 25 L 32 35 L 41 25" stroke="url(#ay-favicon-grad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 32 35 L 32 51" stroke="url(#ay-favicon-grad)" stroke-width="4.2" stroke-linecap="round" />

  <!-- Circuit nodes -->
  <circle cx="32" cy="13" r="2.8" fill="#06b6d4" />
  <circle cx="17" cy="49" r="2.8" fill="#10b981" />
  <circle cx="47" cy="49" r="2.8" fill="#10b981" />
  <circle cx="32" cy="51" r="3" fill="#10b981" />
  <circle cx="32" cy="35" r="2" fill="#06b6d4" />
</svg>
